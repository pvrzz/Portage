name: Unit tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python dependencies
        run: python3 -m pip install cryptography
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Browser API mock tests
        run: node tests/test_storage_browser.cjs
      - name: Profile safety tests
        run: node tests/test_profile_safety.cjs
      - name: IndexedDB codec tests
        run: node tests/test_indexeddb_codec.cjs
      - name: IndexedDB path tests
        run: node tests/test_indexeddb_paths.cjs
      - name: Python syntax
        run: python3 -m py_compile tools/*.py tests/*.py
      - name: JavaScript syntax
        run: |
          for file in tools/*.cjs tools/*.js tests/*.cjs chrome/dashboard.js firefox/dashboard.js; do
            node --check "$file"
          done
      - name: CLI help
        run: |
          node tools/chromium_localstorage_import.cjs --help
          node tools/indexeddb_migrate.cjs --help
